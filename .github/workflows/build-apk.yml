name: Build NJR Movies Pro APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'NJR-MOVIES-PRO-ANDROID-PROJECT-CLOUDFLARE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="NJR-MOVIES-PRO-ANDROID-PROJECT-CLOUDFLARE.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Upload the ZIP file to the top level of the repository."
            exit 1
          fi
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project
          PROJECT_DIR="$(find extracted-project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Could not find an Android project containing settings.gradle.kts and app/ inside the ZIP."
            find extracted-project -maxdepth 4 -print
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: gradle -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NJR-MOVIES-PRO-APK
          path: extracted-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
